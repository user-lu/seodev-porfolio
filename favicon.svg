<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Adaptive Dark Slate Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
  </defs>

  <!-- Container -->
  <rect width="512" height="512" rx="120" fill="url(#bgGrad)" stroke="#334155" stroke-width="8"/>

  <!-- Left Angle Bracket `<` -->
  <path d="M 125 215 L 75 256 L 125 297" fill="none" stroke="#38bdf8" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Monogram `LS` -->
  <text x="248" y="296" font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-weight="700" font-size="140" fill="#ffffff" text-anchor="middle" letter-spacing="-3">LS</text>

  <!-- Forward Slash & Right Angle Bracket `/>` -->
  <path d="M 370 195 L 335 317" fill="none" stroke="#38bdf8" stroke-width="22" stroke-linecap="round"/>
  <path d="M 387 215 L 437 256 L 387 297" fill="none" stroke="#38bdf8" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
